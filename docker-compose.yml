# SAM backend — production docker-compose.
#
# Run on the VM:
#   cp .env.production.example .env       # then edit secrets
#   docker compose pull                   # if using a registry image
#   docker compose up -d --build          # build + start in background
#   docker compose logs -f backend        # tail logs
#
# Coexists with the CRM compose project on the same VM:
#   • SAM Postgres: NOT exposed to host (only reachable from sam backend container)
#   • SAM backend: bound to 127.0.0.1:5500 (nginx fronts it on 443)
#   • Volumes are project-prefixed by docker compose v2, so the
#     'pgdata' volume here does not collide with the CRM's 'pgdata'.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sam
      POSTGRES_USER: sam_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sam_user -d sam"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Loopback only — the public-facing TLS termination is nginx on the host.
      # If you ever need to hit SAM directly from the host: curl 127.0.0.1:5500
      - "127.0.0.1:5500:5500"
    env_file:
      - .env
    environment:
      # Container-internal DNS: 'db' resolves to the postgres service above.
      DATABASE_URL: postgresql://sam_user:${POSTGRES_PASSWORD}@db:5432/sam?schema=public
      PORT: 5500
      NODE_ENV: production
    volumes:
      # Persist commercial-change approval PDFs across container rebuilds.
      - sam_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  sam_uploads:
